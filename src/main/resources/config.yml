# SmartHordes: configuracao
#
# Valores abaixo sao os padroes. Chave que faltar e adicionada sozinha quando o servidor liga.
# Atualizando do HardcoreRoulette 1.3 ou anterior: na primeira vez o plugin copia as secoes
# invasion, nether-horde e horde do config.yml dele.

# Log detalhado em plugins/SmartHordes/logs (ligue so para investigar um problema).
# /horda report gera um relatorio para anexar num issue.
debug: false

# Mundo das hordas quando o HardcoreRoulette nao esta instalado (vazio = mundo principal).
# Com o HardcoreRoulette, a horda sempre vai para o mundo da run atual.
world: ""

# Servidor de teste: liga so a arena (/arena) e desliga a horda normal.
arena-mode: false

# Horda noturna de zumbis (avisada a tarde, nasce as 13000 ticks).
invasion:
  enabled: true
  min-day: 1
  max-zombies: 24
  rest-nights: 1            # noites sem horda depois de uma horda
  chance:
    zumbis: 0.25
  ramp:
    chance-per-hour: 0.06   # a chance sobe com as horas de jogo da run...
    max-chance: 0.55        # ...ate este teto
    size-per-hour: 2
    days-per-zombie: 4

# Zumbis-porco que seguem quem fica muito tempo no Nether.
nether-horde:
  enabled: true
  max-minutes: 10

# IA da horda (cavar, rampas, cercar). Desligue o que pesar no servidor.
horde:
  emerge: true              # mobs saem de dentro da terra com animacao
  swim: true                # na agua, nadam ate a margem (nunca afundam ate virar afogado sozinhos)
  cave-miners: true         # alvo no subsolo: horda so de mineradores que cavam blocos naturais da caverna
                            # (base de pedregulho, tijolo, madeira, vidro ou pedra lapidada fica segura)
  drowned: true             # alguns viram afogados da horda na agua: nadam rapido e alcancam quem esta nela
  p:
    pillar_max_dy: 4        # pilar individual so ate esta altura; acima, rampa coletiva
    pioneer_max_dy: 6       # pioneiro so age ate esta altura
    drowned_chance: 0.4     # chance de virar afogado (sorteada uma vez, depois de 3 s na agua)
    drowned_chance_defense: 0.8  # se o alvo se defende com agua (nadando, barco, ilha, fosso)
    diver_share: 0.6        # guerreiros que mergulham de proposito contra defesa de agua
    diver_share_builders: 0.2  # construtores que mergulham (o resto tenta ponte/rampa)
  surround: true
  ramp: true
  ramp-pioneer: true        # 1 construtor por alvo faz o proprio pilar/ponte direto enquanto a rampa sobe
  ramp-widen: true          # quem esperaria na base alarga a rampa ja feita (2 de largura, para hordas grandes)
  ramp-repair: true         # rampa travada na curva: conserta o canto ou desmonta o trecho de cima e refaz
  ramp-shapes: "straight,zigzag,spiral"
  ramp-wide-floating: true
  dig-stairs: true
  escape-ceiling: true
  warrior-escort: true
  clear-leaves: true        # tiram na mao as folhas que travam o caminho (pinheiro com galho ate o chao)
  fell-whole-tree: true     # lenhador derruba a arvore inteira (sem toco flutuando)
  tidy-gather: true         # coleta organizada: um buraco so, de cima para baixo, sem furos espalhados
  log-to-planks: true
  no-self-push: true
  block-capacity: 32
  record: true
  debug: false
